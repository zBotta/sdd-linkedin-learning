[project]
name = "linkedin-saved-library"
version = "0.1.0"
description = "Local sync prototype for LinkedIn saved posts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.45.0",
  "pydantic>=2.8.0",
  "PyYAML>=6.0.0",
  "bertopic>=0.16.0",
  "sentence-transformers>=2.7.0",
  "scikit-learn>=1.4.0",
  "fastapi>=0.111.0",
  "uvicorn>=0.30.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
