[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linkedin-saved-library"
version = "0.1.0"
description = "Local sync prototype for LinkedIn saved posts"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
  "playwright>=1.45.0",
  "pydantic>=2.8.0",
  "PyYAML>=6.0.0",
  "bertopic>=0.16.0",
  "sentence-transformers>=2.7.0",
  "scikit-learn>=1.4.0",
  "fastapi>=0.111.0",
  "uvicorn>=0.30.0",
  "httpx>=0.27.0",
  "streamlit>=1.36.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
]

[tool.setuptools.packages.find]
include = [
  "cloud*",
  "shared*",
  "local_sync*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
  "real_runtime: executes real podman compose deployment and live service checks",
]

